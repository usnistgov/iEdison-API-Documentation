stages:
  - deploy

push_to_github:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-repository git
    - git config --global user.email "you@example.com"
    - git config --global user.name "GitLab CI"
  script:
    # 1. Add the GitHub remote using a variable for the token
    - git remote add github https://x-access-token:${GITHUB_TOKEN}@github.com/usnistgov/iEdison-API-Documentation.git
    
    # 2. Use subtree to push ONLY the docs folder to the nistpages branch
    # This keeps the GitHub repo clean of your other GitLab files
    - git subtree push --prefix docs github nistpages
  when: manual
  only:
    - main  # Only show the button when on the main branch