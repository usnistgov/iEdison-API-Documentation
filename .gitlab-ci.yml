stages:
  - push

push_to_github:
  stage: push
  image: alpine:latest
  script:
    - apk add --no-cache git
    
    - git config --global user.email "ci@gitlab.com"
    - git config --global user.name "GitLab CI"
    
    - git clone --mirror https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git mirror.git
    
    - cd mirror.git
    - git push --mirror https://hichamnist:${GITHUB_TOKEN}@github.com/usnistgov/iEdison-API-Documentation.git
  
  when: manual
  only:
    - branches
