stages:
  - push

push_to_github:
  stage: push
  image: alpine:latest
  script:
    # 1. Install Git (and LFS just in case)
    - apk add --no-cache git git-lfs
    
    # 2. Add the GitHub remote using your variables
    # Note: We use the existing checkout instead of cloning again
    - git remote add github "https://${GITHUB_USER}:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    
    # 3. Ensure we have all tags and branches locally to mirror them
    - git fetch --all
    
    # 4. Push everything to GitHub
    # The --prune flag ensures deleted branches in GitLab are also deleted in GitHub
    - git push github --mirror
    
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual